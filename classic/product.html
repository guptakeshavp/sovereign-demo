<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customise — Sovereign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/pages.css">
<link rel="icon" href="assets/logo/mark.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>
<body data-nav="light">
<script src="js/partials.js"></script>

<main class="pdp">
  <div class="pdp-stage">
    <div class="stage-label"><span>Preview</span><b id="stage-desc">—</b></div>
    <div class="garment" id="stage"></div>
    <figure class="mono-inset" id="mono"><div id="mono-art"></div><figcaption id="mono-cap">Your initials, inside the chest pocket</figcaption></figure>
  </div>

  <div class="pdp-panel">
    <p class="eyebrow" id="p-for">—</p>
    <h1 id="p-name">—</h1>
    <p class="price" id="p-price">—</p>
    <p class="note" id="p-note">—</p>

    <div id="options"></div>

    <div class="summary" id="summary"></div>
    <div class="pdp-actions">
      <button class="btn solid" id="add">Add to bag</button>
      <a class="btn" href="story.html#fitting">Book a fitting</a>
    </div>

    <div class="details">
      <details open><summary>Cloth </summary><p id="d-cloth"></p></details>
      <details><summary>Construction </summary><p id="d-make"></p></details>
      <details><summary>Delivery and fittings </summary><p>Standard sizes ship in three weeks. Made to measure takes four to six and includes one fitting, at our studio or over video. Alterations within the first year are on us.</p></details>
    </div>
  </div>
</main>

<section class="pdp-related ash-2">
  <div class="wrap">
    <div class="sec-head"><div><h2 class="t-m rv">Worn with</h2></div></div>
    <div class="grid g-3" id="related"></div>
  </div>
</section>

<div id="footer-slot"></div>
<script src="js/garments.js"></script>
<script src="js/main.js"></script>
<script src="js/customiser.js"></script>
</body>
</html>
