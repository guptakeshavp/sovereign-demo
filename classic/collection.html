<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The collection — Sovereign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/pages.css">
<link rel="icon" href="assets/logo/mark.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>
<body data-nav="light">
<script src="js/partials.js"></script>

<main class="wrap">
  <div class="coll-head">
    <div>
      <h1 class="t-xl" data-lines><span class="rv-line"><span>Nine styles,</span></span><span class="rv-line"><span><em id="h-for">for everyone</em>.</span></span></h1>
    </div>
    <div class="filters rv" id="filters">
      <button data-for="all" aria-pressed="true">All</button>
      <button data-for="women" aria-pressed="false">Women</button>
      <button data-for="men" aria-pressed="false">Men</button>
    </div>
  </div>
  <div class="frame band rv" id="coll-band"><img src="assets/images/flatlay.jpg" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>
  <div class="coll-grid" id="grid"></div>

  <div class="coll-note">
    <div>
      <h2 class="t-m rv" data-delay=".1">Nothing here is on a shelf.</h2>
    </div>
    <p class="t-lead rv" data-delay=".2">Each piece is cut after you order it, in the cloth and the cut you choose. Standard sizes ship in three weeks. Made to measure takes four to six, and includes a fitting at our studio or over video.</p>
  </div>
</main>

<div id="footer-slot"></div>
<script src="js/garments.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  const G = window.Garments;
  const params = new URLSearchParams(location.search);
  let filter = params.get('for') || 'all';
  const grid = document.getElementById('grid');
  const card = (p, i) => `
    <a class="card rv" data-delay="${(i % 3) * .1}" href="product.html?style=${p.id}">
      <div class="frame"><div class="garment">${G.renderProduct(p)}</div></div>
      <div class="card-meta"><h3>${p.name}</h3><span class="price">From ${G.money(p.price)}</span></div>
      <p class="card-sub">${p.note}</p>
    </a>`;
  function render(animate) {
    const list = G.CATALOGUE.filter(p => filter === 'all' || p.for === filter);
    grid.innerHTML = list.map(card).join('');
    grid.querySelectorAll('.stitch').forEach(el => { el.innerHTML = '<svg viewBox="0 0 12 12"><path d="M1.5 1.5 L10.5 10.5"/><path d="M10.5 1.5 L1.5 10.5"/></svg>'; });
    document.getElementById('h-for').textContent = filter === 'all' ? 'for everyone' : 'for ' + filter;
    document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', b.dataset.for === filter));
    if (animate && window.SOV.hasGsap && !window.SOV.reduce) {
      gsap.fromTo(grid.querySelectorAll('.card'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .9, stagger: .07, ease: 'power3.out' });
    } else if (animate) grid.querySelectorAll('.rv').forEach(el => { el.style.opacity = 1; el.style.transform = 'none'; });
  }
  render(false);
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.for; history.replaceState(null, '', filter === 'all' ? 'collection.html' : 'collection.html?for=' + filter);
    render(true);
  });
})();
</script>
</body>
</html>
